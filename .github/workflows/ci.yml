name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - run: make test
      - name: Validate the example catalogue
        run: make check
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/statusd
      - name: Render the example values
        run: |
          deploy/helm/catalog-values.sh catalog/ > catalog-values.yaml
          helm template eu1 deploy/helm/statusd -f deploy/examples/helm-values-eu1.yaml -f catalog-values.yaml > /dev/null
          helm template eu1 deploy/helm/statusd -f deploy/examples/helm-values-eu1.yaml -f catalog-values.yaml --set publicUI.enabled=true > /dev/null
          helm template witness deploy/helm/statusd -f deploy/examples/helm-values-witness.yaml > /dev/null
  image:
    if: github.event_name == 'push'
    needs: [test, helm]
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - id: meta
        run: |
          img=ghcr.io/$(echo "${{ github.repository }}" | tr A-Z a-z)
          if [ "${{ github.ref_type }}" = tag ]; then tag=${{ github.ref_name }}; else tag=latest; fi
          echo "img=$img" >> "$GITHUB_OUTPUT"; echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VERSION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.img }}:${{ steps.meta.outputs.tag }},${{ steps.meta.outputs.img }}:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: ${{ steps.meta.outputs.img }}/web:${{ steps.meta.outputs.tag }},${{ steps.meta.outputs.img }}/web:${{ github.sha }}
