# Example Helm values: the raft witness. Votes only: no catalogue, no evaluation, no public Service.
# Secrets: statusd-witness-secrets (cluster-key), statusd-tls-witness.
# Put it in a third location if you can: wherever it runs, losing that site together with one
# full node loses quorum.
role: witness
nodeId: witness
existingSecret: statusd-witness-secrets
tlsSecret: statusd-tls-witness
persistence: {size: 1Gi, storageClass: ""}
resources:
  requests: {cpu: 10m, memory: 64Mi}
  limits: {memory: 256Mi}
clusterService:
  type: LoadBalancer
  loadBalancerIP: ""
  loadBalancerSourceRanges: []
config:
  node: {id: witness, witness: true, data_dir: /var/lib/statusd}
  listen: {internal: ":8443", admin: ":8081"}
  raft:
    bind: ":7000"
    advertise: "statusd-witness.example.net:7000"
    bootstrap: true
    tls: {ca_file: /etc/statusd/tls/ca.pem, cert_file: /etc/statusd/tls/node.pem, key_file: /etc/statusd/tls/node-key.pem, server_name: statusd}
    peers:
      - {id: eu1, address: "statusd-eu1.example.net:7000", api: "https://statusd-eu1.example.net:8443"}
      - {id: us1, address: "statusd-us1.example.net:7000", api: "https://statusd-us1.example.net:8443"}
      - {id: witness, address: "statusd-witness.example.net:7000", api: "https://statusd-witness.example.net:8443", witness: true}
  cluster_key_file: /etc/statusd/secrets/cluster-key
