node: {id: eu1, witness: false, data_dir: /data}
listen:
  public: ":8080"
  admin: ":8081"
  internal: ":8443"
raft:
  bind: ":7000"
  advertise: "eu1-raft:7000"
  bootstrap: true
  tls: {ca_file: /certs/ca.pem, cert_file: /certs/eu1.pem, key_file: /certs/eu1-key.pem}
  peers:
    - {id: eu1, address: "eu1-raft:7000", api: "https://eu1-raft:8443"}
    - {id: us1, address: "us1-raft:7000", api: "https://us1-raft:8443"}
    - {id: witness, address: "witness-raft:7000", api: "https://witness-raft:8443", witness: true}
cluster_key_env: STATUSD_CLUSTER_KEY
evaluation: {interval: 5s}
catalog_dir: /etc/statusd/test-catalog
public: {cors_origins: ["*"], stale_after: 30s}
sources:
  prom:
    endpoints:
      - {url: "http://prom-eu:9090", timeout: 2s}
admin:
  dev_insecure_user: ha-test@localhost
