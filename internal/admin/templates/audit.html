{{define "content"}}
<h1>Audit log</h1>
<table class="compact">
<tr><th>Time</th><th>Who</th><th>Action</th><th>Target</th><th>Detail</th></tr>
{{range .Data.List}}<tr><td>{{ts .TS}}</td><td>{{.Actor}}</td><td>{{.Action}}</td><td>{{.Target}}</td><td>{{.Detail}}</td></tr>
{{else}}<tr><td colspan="5" class="muted">Nothing yet.</td></tr>{{end}}
</table>
{{end}}
